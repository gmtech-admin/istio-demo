steps:
  # -----------------------------
  # 1. Read version from pyproject.toml
  # -----------------------------
  - name: python:3.11
    id: "read-version"
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install toml
        VERSION=$(python3 - <<EOF
        import toml
        data = toml.load("pyproject.toml")
        print(data["project"]["version"])
        EOF
        )
        echo "Detected version: $$VERSION"
        echo "_VERSION=$VERSION" > /workspace/version.env

  # -----------------------------
  # 2. Build Docker image using version
  # -----------------------------
  - name: gcr.io/cloud-builders/docker
    id: "build-image"
    entrypoint: bash
    args:
      - "-c"
      - |
        source /workspace/version.env
        docker build -t europe-west2-docker.pkg.dev/$PROJECT_ID/docker-wif-demo/coldstore:${_VERSION} .

  # -----------------------------
  # 3. Push image
  # -----------------------------
  - name: gcr.io/cloud-builders/docker
    id: "push-image"
    entrypoint: bash
    args:
      - "-c"
      - |
        source /workspace/version.env
        docker push europe-west2-docker.pkg.dev/$PROJECT_ID/docker-wif-demo/coldstore:${_VERSION}

  # -----------------------------
  # 4. Deploy to Cloud Run (optional)
  # -----------------------------
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: "deploy"
    entrypoint: bash
    args:
      - "-c"
      - |
        source /workspace/version.env
        gcloud run deploy myapp \
          --image gcr.io/$PROJECT_ID/myapp:${_VERSION} \
          --region europe-west2 \
          --platform managed

options:
  logging: CLOUD_LOGGING_ONLY
  automapSubstitutions: true
  env:
    - _VERSION

images:
  - europe-west2-docker.pkg.dev/$PROJECT_ID/docker-wif-demo/coldstore:${_VERSION}
