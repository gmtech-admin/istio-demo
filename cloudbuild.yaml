steps:

  # -----------------------------
  # 1. Build Docker image using version
  # -----------------------------
  - name: gcr.io/cloud-builders/docker
    id: build-image
    entrypoint: bash
    args:
      - "-c"
      - |
        source /workspace/image.env
        IMAGE="europe-west2-docker.pkg.dev/$PROJECT_ID/docker-wif-demo/bookinfo:$TAG_NAME"
        echo "Building image: $IMAGE"
        docker build -t "$IMAGE" .

  # -----------------------------
  # 2. Push image
  # -----------------------------
  - name: gcr.io/cloud-builders/docker
    id: push-image
    entrypoint: bash
    args:
      - "-c"
      - |
        source /workspace/image.env
        IMAGE="europe-west2-docker.pkg.dev/$PROJECT_ID/docker-wif-demo/bookinfo:$TAG_NAME"
        echo "Pushing image: $IMAGE"
        docker push "$IMAGE"

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - europe-west2-docker.pkg.dev/$PROJECT_ID/docker-wif-demo/bookinfo:$TAG_NAME
