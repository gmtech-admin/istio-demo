steps:
  # -----------------------------
  # 1. Build Docker image using version
  # -----------------------------
  - name: gcr.io/cloud-builders/docker
    id: build-image
    script: |
      #!/bin/sh
      set -e
      docker build -t ${_IMAGE} .
  # -----------------------------
  # 2. Push image
  # -----------------------------
  - name: gcr.io/cloud-builders/docker
    id: push-image
    script: |
      #!/bin/sh
      set -e
      docker push ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _IMAGE: "europe-west2-docker.pkg.dev/${PROJECT_ID}/docker-wif-demo/bookinfo:${TAG_NAME}"
images:
  - ${_IMAGE}