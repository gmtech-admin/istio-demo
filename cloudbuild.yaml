steps:
  # -----------------------------
  # 1. Read version from manifest.yaml
  # -----------------------------
  - name: python:3.11
    id: read-image-version
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install pyyaml
        VERSION=$(python3 - <<'EOF'
        import yaml
        with open("manifest.yaml") as f:
            data = yaml.safe_load(f)
        print(data["image"]["version"])
        EOF
                )
                echo "VERSION=$VERSION" > /workspace/image.env
                echo "Detected version: $VERSION"

  # -----------------------------
  # 2. Build Docker image using version
  # -----------------------------
  - name: gcr.io/cloud-builders/docker
    id: build-image
    entrypoint: bash
    args:
      - "-c"
      - |
        source /workspace/image.env
        IMAGE="europe-west2-docker.pkg.dev/$PROJECT_ID/docker-wif-demo/bookinfo:${VERSION}"
        echo "Building image: $IMAGE"
        docker build -t "$IMAGE" .

  # -----------------------------
  # 3. Push image
  # -----------------------------
  - name: gcr.io/cloud-builders/docker
    id: push-image
    entrypoint: bash
    args:
      - "-c"
      - |
        source /workspace/image.env
        IMAGE="europe-west2-docker.pkg.dev/$PROJECT_ID/docker-wif-demo/bookinfo:${VERSION}"
        echo "Pushing image: $IMAGE"
        docker push "$IMAGE"

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - europe-west2-docker.pkg.dev/$PROJECT_ID/docker-wif-demo/bookinfo
